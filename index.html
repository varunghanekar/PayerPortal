/* ---------------------- IXP / AI simulation ---------------------- */
function runIXP(caseId){
  const c = getCase(caseId);
  if(c.status==='NEW') c.status='IN_REVIEW';
  const btn = document.getElementById('runIxpBtn');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner spinner-dark"></span> Extracting...'; }
  renderCasePanel(); // reflect status change in header while processing shows next tick
  setTimeout(()=>{
    /* Extraction runs over the documents genuinely stored for this case,
       so the results always match what the user actually uploaded. */
    const stored = storedDocs[c.id] || [];
    c.ixp.docs = {};
    stored.forEach(d=>{
      const name = d.fileName;
      const base = /lab/i.test(name) ? 0.97
        : (/history/i.test(name) && c.id.endsWith('002')) ? 0.81
        : (0.90 + Math.random()*0.08);
      c.ixp.docs[name] = {
        conf: Math.min(0.99, base),
        fields: (c.ixp.sample || [['Member ID', c.memberId],['CPT Code', (c.cptList||[]).join(', ')],['Diagnosis Code', c.diagnosisCode],['Provider NPI', c.npi]])
      };
    });
    c.ixp.ran = true;
    toast('IXP extraction complete — structured data extracted from PA packet.', 'success');
    renderCasePanel();
    renderQueueTableFiltered();
  }, 1000);
}

function runAI(caseId){
  const c = getCase(caseId);
  const btn = document.getElementById('runAiBtn');
  if(btn){ btn.disabled=true; btn.innerHTML = '<span class="spinner spinner-dark"></span> Validating...'; }
  setTimeout(()=>{
    const isAutoApprove = c.ai.criteriaMissing.length===0;
    c.ai.decision = isAutoApprove ? 'AUTO_APPROVE' : 'ESCALATE';
    c.ai.confidence = isAutoApprove ? (0.90+Math.random()*0.08) : (0.60+Math.random()*0.12);
    c.ai.ran = true;
    c.status = isAutoApprove ? 'AUTO_APPROVED' : 'ESCALATED';
    toast(isAutoApprove ? 'AI recommends AUTO-APPROVE — all criteria met.' : 'AI flagged missing documentation — escalated to Case Manager.', isAutoApprove?'success':'error');
    renderCasePanel();
    renderQueueTableFiltered();
  }, 1200);
}

/* ---------------------- Decision / letter ---------------------- */
function makeDecision(caseId, decision){
  const c = getCase(caseId);
  c.caseManager.decision = decision;
  c.caseManager.name = 'Dr. Lisa Chen, MD';
  c.caseManager.decidedAt = nowStamp();

  if(decision==='APPROVED'){
    c.status = c.ai.decision==='ESCALATE' ? 'APPROVED_COND' : 'APPROVED';
    c.authNumber = `${c.payerShort==='Aetna'?'AET':'UHC'}-PA-2026-${randDigits(6)}`;
    const from = new Date(); const to = new Date(); to.setDate(to.getDate()+90);
    c.authValidFrom = from.toISOString().slice(0,10);
    c.authValidTo = to.toISOString().slice(0,10);
    toast('Case approved — authorization number generated.', 'success');
  } else if(decision==='DENIED'){
    c.status='DENIED';
    toast('Case denied. Determination letter available for download.', 'error');
  } else {
    c.status='PENDED';
    toast('Case pended — additional information requested from provider.');
  }
  state.letters.push({caseId:c.id, patientName:c.patientName, decisionStatus:c.status, ts:nowStamp()});
  renderCasePanel();
  renderQueueTableFiltered();
}

function buildLetterText(c){
  const lines = [];
  lines.push('PRIOR AUTHORIZATION DETERMINATION LETTER');
  lines.push(c.payer.toUpperCase());
  lines.push('----------------------------------------------------------------');
  lines.push('Case ID: '+c.id);
  lines.push('Date Issued: '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}));
  lines.push('');
  lines.push('Member: '+c.patientName+'   (DOB '+c.dob+')');
  lines.push('Member ID: '+c.memberId);
  lines.push('Health Plan: '+c.payer);
  lines.push('');
  lines.push('Requesting Provider: '+c.provider+'  (NPI '+c.npi+')');
  lines.push('Provider Organization: '+c.providerOrg);
  lines.push('');
  lines.push('Requested Procedure(s): '+c.procedure+'  (CPT '+c.cptList.join(', ')+')');
  lines.push('Diagnosis: '+c.diagnosisName+'  ('+c.diagnosisCode+')');
  lines.push('');
  lines.push('DETERMINATION: '+ (STATUS_META[c.status]?STATUS_META[c.status].label.toUpperCase():c.status));
  if(c.authNumber){
    lines.push('Authorization Number: '+c.authNumber);
    lines.push('Valid From: '+c.authValidFrom+'   Valid To: '+c.authValidTo);
  }
  lines.push('');
  lines.push('CLINICAL BASIS FOR DETERMINATION');
  lines.push(c.ai.ran ? c.ai.reasoning : 'Clinical validation pending at time of letter generation.');
  if(c.ai.criteriaMissing && c.ai.criteriaMissing.length){
    lines.push('');
    lines.push('Documentation flagged for review:');
    c.ai.criteriaMissing.forEach(m=> lines.push('  - '+m));
  }
  if(c.caseManager.notes){
    lines.push('');
    lines.push('Case Manager Notes ('+c.caseManager.name+'):');
    lines.push(c.caseManager.notes);
  }
  lines.push('');
  lines.push('NEXT STEPS FOR PROVIDER');
  if(c.status==='APPROVED' || c.status==='AUTO_APPROVED' || c.status==='APPROVED_COND'){
    lines.push('This authorization permits the above procedure(s) to be performed within the validity period. Please reference the authorization number on all related claims.');
  } else if(c.status==='DENIED'){
    lines.push('This request has been denied based on the clinical basis above. The provider or member may submit an appeal with additional supporting documentation within 30 days of this notice.');
  } else {
    lines.push('Additional documentation has been requested. Please submit the missing information listed above to avoid delay in the coverage determination.');
  }
  lines.push('');
  lines.push('This determination was generated with the assistance of AI-based clinical validation and reviewed under the applicable regulatory and payer clinical review standards. This is a demo document generated by the PayerConnect Prior Authorization Portal (Genzeon Services) and does not represent an actual coverage decision.');
  return lines.join('\n');
}

function downloadDeterminationLetter(caseId){
  const c = getCase(caseId);
  if(!c){ toast('Case not found.','error'); return; }
  const text = buildLetterText(c);
  const fileBase = c.patientName.replace(/[^a-z0-9]+/gi,'_') + '_Determination';
  try{
    if(window.jspdf && window.jspdf.jsPDF){
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:'letter'});
      const margin = 54; let y = margin;
      doc.setFont('helvetica','bold'); doc.setFontSize(14);
      doc.setTextColor(11,29,58);
      doc.text('PayerConnect — Prior Authorization Determination', margin, y); y+=22;
      doc.setDrawColor(18,167,155); doc.setLineWidth(1.2); doc.line(margin,y,558,y); y+=18;
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(60,70,88);
      const bodyLines = text.split('\n');
      bodyLines.forEach(line=>{
        const wrapped = doc.splitTextToSize(line, 504);
        wrapped.forEach(w=>{
          if(y>740){ doc.addPage(); y=margin; }
          if(/^[A-Z ]{6,}$/.test(line.trim()) && line.trim().length>0){ doc.setFont('helvetica','bold'); } else { doc.setFont('helvetica','normal'); }
          doc.text(w, margin, y);
          y+=13;
        });
      });
      doc.save(fileBase+'.pdf');
      toast('Determination letter downloaded (PDF).', 'success');
      return;
    }
  }catch(err){ /* fall through to text */ }
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = fileBase+'.txt'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Determination letter downloaded.', 'success');
}

/* ---------------------- Document upload / download ---------------------- */
/* ---------------------------------------------------------------
   DOCUMENT STORAGE
   Uploads go to the payer-documents bucket through the
   payer-document-upload Edge Function. The in-memory document
   list is kept in step so the rest of the panel, IXP extraction
   and letter generation keep working exactly as before.
   --------------------------------------------------------------- */

const storedDocs = {};      // caseId -> rows from payer_document_s
let storageError = null;

async function refreshStoredDocs(caseId, rerender){
  try{
    storedDocs[caseId] = await window.PAYER_STORAGE.list(caseId);
    storageError = null;
  }catch(e){
    storedDocs[caseId] = storedDocs[caseId] || [];
    storageError = e.message || 'Unable to reach the document service.';
  }
  if(rerender && state.activeCaseId === caseId) renderCasePanel();
}

function uploadNote(text, tone){
  const el = document.getElementById('payerUploadNote');
  if(!el) return;
  el.innerHTML = text
    ? `<div class="empty-hint" style="color:${tone==='error'?'var(--red-600)':'var(--ink-500)'}">${text}</div>`
    : '';
}

async function storeFiles(caseId, files, opts){
  const list = Array.from(files || []);
  if(!list.length) return [];

  /* Stamp the member id and patient name onto every document so it can
     be retrieved by module + member id + name. */
  const kase = getCase(caseId) || {};
  opts = Object.assign({ memberId: kase.memberId, patientName: kase.patientName }, opts || {});
  const rows = [];
  for(let i=0;i<list.length;i++){
    const f = list[i];
    uploadNote(`Uploading ${f.name} (${i+1} of ${list.length})…`);
    try{
      const row = await window.PAYER_STORAGE.upload(caseId, f, opts || {});
      storedDocs[caseId] = (storedDocs[caseId] || []).concat(row);
      rows.push(row);
    }catch(e){
      uploadNote(`${f.name} failed: ${e.message}`, 'error');
      toast(f.name + ' could not be uploaded: ' + e.message, 'error');
    }
  }
  if(rows.length) uploadNote('');
  return rows;
}

/* Replace one of the packet's required documents. */
async function handleDocUpload(caseId, idx, files){
  if(!files || !files.length) return;
  const c = getCase(caseId);
  const f = files[0];
  const doc = c.documents[idx];

  const rows = await storeFiles(caseId, [f], {
    documentKind: doc.kind || 'supplemental',
    replacesName: doc.name
  });

  /* Keep the local view usable whether or not storage succeeded. */
  doc.preloaded = false;
  doc.fileObj = f;
  doc.size = f.size;
  doc.uploadedAt = nowStamp();
  doc.blobUrl = URL.createObjectURL(f);
  if(rows.length){
    doc.storedId = rows[0].id;
    doc.uploadedBy = rows[0].uploadedBy;
    toast('Replaced "'+doc.name+'" with "'+f.name+'" and stored it in Supabase.', 'success');
  }else{
    toast('Replaced "'+doc.name+'" with "'+f.name+'" locally only.', 'error');
  }
  renderCasePanel();
}

/* Add supplemental documents to the packet. */
async function handleAddDocs(caseId, files){
  if(!files || !files.length) return;
  const c = getCase(caseId);
  const rows = await storeFiles(caseId, files, { documentKind: 'supplemental' });

  Array.from(files).forEach(f=>{
    const row = rows.find(r=>r.fileName === f.name);
    c.documents.push({
      name:f.name, kind:'supplemental', preloaded:false,
      size:f.size, uploadedAt:nowStamp(), fileObj:f,
      blobUrl:URL.createObjectURL(f),
      storedId: row ? row.id : null,
      uploadedBy: row ? row.uploadedBy : null
    });
  });

  if(rows.length){
    toast(rows.length+' document(s) uploaded to the payer-documents bucket.', 'success');
  }else{
    toast(files.length+' document(s) attached locally only.', 'error');
  }
  renderCasePanel();
}

function downloadDocument(caseId, idx){
  const c = getCase(caseId);
  const doc = c.documents[idx];
  if(doc.fileObj && doc.blobUrl){
    const a=document.createElement('a'); a.href=doc.blobUrl; a.download=doc.name; document.body.appendChild(a); a.click(); a.remove();
    toast('Downloaded '+doc.name, 'success');
    return;
  }
  // generate a realistic stand-in PDF for pre-loaded demo documents
  try{
    const { jsPDF } = window.jspdf;
    const doc2 = new jsPDF({unit:'pt', format:'letter'});
    doc2.setFont('helvetica','bold'); doc2.setFontSize(13); doc2.setTextColor(11,29,58);
    doc2.text(doc.name.replace('.pdf',''), 54, 60);
    doc2.setDrawColor(200,205,215); doc2.line(54,72,558,72);
    doc2.setFont('helvetica','normal'); doc2.setFontSize(10); doc2.setTextColor(50,60,75);
    let y=98;
    const stub = stubContentFor(c, doc.kind);
    stub.forEach(row=>{
      const wrapped = doc2.splitTextToSize(row, 504);
      wrapped.forEach(w=>{ doc2.text(w,54,y); y+=15; });
      y+=4;
    });
    doc2.setFontSize(8); doc2.setTextColor(150,150,150);
    doc2.text('Demo document generated by PayerConnect Portal — Genzeon Services. For demonstration purposes only.', 54, 760);
    doc2.save(doc.name);
    toast('Downloaded '+doc.name, 'success');
  }catch(e){
    toast('Could not generate file for download.', 'error');
  }
}
function stubContentFor(c, kind){
  if(kind==='form') return [
    'PRIOR AUTHORIZATION REQUEST FORM',
    'Payer: '+c.payer,
    'Member: '+c.patientName+'  |  Member ID: '+c.memberId+'  |  DOB: '+c.dob,
    'Requesting Provider: '+c.provider+'  (NPI '+c.npi+')',
    'Requested Procedure(s): '+c.procedure+'  |  CPT: '+c.cptList.join(', '),
    'Diagnosis Code(s): '+c.diagnosisCode,
    'Requested Service Date: within 14 days of submission',
    'Provider Signature: [on file]',
  ];
  if(kind==='notes') return [
    'PHYSICIAN / CLINICAL NOTES',
    'Patient: '+c.patientName,
    'Chief Complaint & History: See referral documentation for '+c.diagnosisName+'.',
    'Treatment History: Documented per attached medical history.',
    'Physician Recommendation: '+c.procedure+' clinically indicated based on exam findings and treatment history.',
    'Ordering Physician: '+c.provider,
  ];
  if(kind==='labs') return [
    'LABORATORY RESULTS',
    'Patient: '+c.patientName,
    'FSH: 8.2 mIU/mL (reference < 10 mIU/mL)',
    'AMH: 1.4 ng/mL (reference > 0.5 ng/mL)',
    'Estradiol: 42 pg/mL',
    'Collection Date: Aug 12, 2026',
    'Ordering Physician: '+c.provider,
  ];
  return [
    'MEDICAL HISTORY / REFERRAL RECORD',
    'Patient: '+c.patientName,
    'Diagnosis History: '+c.diagnosisName+' ('+c.diagnosisCode+')',
    'Prior Procedures / Treatments: See physician notes for treatment history detail.',
    'Referring Provider: '+c.provider,
  ];
}

}
function closeNewReq(){
  document.getElementById('newReqOverlay').classList.remove('open');
  document.body.style.overflow='';
}
function submitNewReq(){
  const val = id => document.getElementById(id).value.trim();
  const name = val('nrName') || 'Unnamed Patient';
  const payer = document.getElementById('nrPayer').value;
  const payerShort = payer.split(' ')[0];
  const cpt = (val('nrCpt')||'00000').split(',').map(s=>s.trim()).filter(Boolean);
  const newCase = {
    id: uid('PAYER-PA-2026'),
    memberId: val('nrMember') || uid('MEM'),
    patientName: name,
    dob: val('nrDob') || '\u2014',
    payer: payer,
    payerShort: payerShort,
    planType: 'Commercial PPO',
    provider: val('nrProvider') || 'Unspecified Provider',
    providerOrg: 'External Provider Submission',
    npi: val('nrNpi') || '\u2014',
    procedure: val('nrProcedure') || 'Unspecified Procedure',
    cptList: cpt.length?cpt:['00000'],
    diagnosisCode: val('nrDx') || '\u2014',
    diagnosisName: 'Provider-submitted diagnosis',
    submitted: nowStamp(),
    channel: 'Manual Intake',
    priority: document.getElementById('nrPriority').value,
    status: 'NEW',
    authNumber:null, authValidFrom:null, authValidTo:null,
    ixp:{ran:false, docs:{}},
    ai:{ran:false, decision:null, confidence:0, criteriaMet:['Documentation appears complete on initial intake'], criteriaMissing: Math.random()>0.5?[]:['Supplemental clinical documentation recommended before final determination'], reasoning:'AI clinical validation for manually-entered cases evaluates uploaded documentation against the closest matching payer criteria set on file.'},
    caseManager:{notes:'', decision:null, name:null, decidedAt:null},
    documents: newReqFiles.map(f=>({name:f.name, kind:'supplemental', preloaded:false, size:f.size, uploadedAt:nowStamp(), fileObj:f, blobUrl:URL.createObjectURL(f)})),
    criteriaRef:{payer:payerShort, cpt:cpt[0]||'00000', name: val('nrProcedure')||'Unspecified Procedure', conditions:['Standard payer clinical review criteria apply — see Clinical Criteria Library for reference procedures.']},
  };
  if(newCase.documents.length===0){
    /* No placeholder document: the packet is uploaded from the case panel. */
  }
  newCase.documents.forEach(d=>{
    newCase.ixp.docs[d.name] = {conf:0, fields:[['Member ID', newCase.memberId],['CPT Code', newCase.cptList.join(', ')],['Diagnosis Code', newCase.diagnosisCode],['Provider NPI', newCase.npi]]};
  });
  state.cases.unshift(newCase);
  closeNewReq();
  toast('New PA request added to queue for '+name+'.', 'success');
  switchView('queue');
  openCase(newCase.id);
}

/* ============================= RESET ============================= */
function resetDemo(){
  /* Cases live in the database now, so a reset clears the in-memory
     workflow state and reloads them rather than restoring seed data. */
  state.letters = [];
  state.activeCaseId = null;
  state.queueFilter='ALL';
  state.queueSearch='';
  closeCase();
  loadPayerCases();
  toast('Workflow state cleared — requests reloaded.', 'success');
  switchView(state.activeView==='dashboard'||state.activeView==='queue'?state.activeView:'dashboard');
}

/* ============================= MODULE MOUNT ============================= */
/* Read-only view of payer cases for cross-module pages. */
window.PAYER_CASES = function(){
  return (state.cases || []).slice();
};

window.EHR_MODULES.payer = {
  config: CONFIG,
  mount(container){
    container.innerHTML = moduleShell();

    document.querySelectorAll('#payerTabs .tab').forEach(btn=>{
      btn.addEventListener('click', ()=> switchView(btn.dataset.view));
    });
    document.getElementById('payerReset').addEventListener('click', resetDemo);
    document.getElementById('caseOverlay').addEventListener('click', e=>{ if(e.target.id==='caseOverlay') closeCase(); });
    document.getElementById('newReqOverlay').addEventListener('click', e=>{ if(e.target.id==='newReqOverlay') closeNewReq(); });

    state.cases = [];
    state.letters = [];
    state.activeCaseId = null;

    document.getElementById('caseFormClose').addEventListener('click', closeCaseForm);
    document.getElementById('caseFormCancel').addEventListener('click', closeCaseForm);
    document.getElementById('caseFormSave').addEventListener('click', saveCaseForm);
    document.getElementById('caseFormOverlay').addEventListener('click', e=>{
      if(e.target.id==='caseFormOverlay') closeCaseForm();
    });

    switchView('dashboard');
    loadPayerCases();
  }
};

})();

  function b64ToUtf8(b64Str) {
    const bin = atob(b64Str);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

/* ===== js/app.js ===== */
/* =========================================================
   EHR PORTAL — SHELL + ROUTER
   Gates on sign-in, renders the Hyperspace chrome once, then
   hands a clean canvas to whichever module the route points at.
   Modules register on window.EHR_MODULES and are mounted lazily.
   ========================================================= */

window.EHR_MODULES = window.EHR_MODULES || {};

(function () {
  "use strict";

  const I = window.EHR.ICONS;
  const esc = window.EHR.esc;
  const mounted = {};
  let current = null;

  /* Workspace tabs sit above the activity rail, as in Hyperspace. */
  const WORKSPACES = [
    { id: "payer", label: "Payer Review", icon: "payer" },
    { id: "claims", label: "Claims", icon: "file" },
    { id: "claimsQaAudit", label: "Claims QA Audit", icon: "criteria" },
    { id: "home", label: "Home", icon: "dashboard" },
    { id: "patients", label: "Patient Lookup", icon: "patients" },
  ];

  function shellHTML(user) {
    return `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">CA</div>
          <div class="brand-name">CAPS | DEMO</div>
          <div class="brand-sub">Core Administrative Processing System</div>
        </div>
        <div class="env-chip">DEMO</div>
        <div class="topbar-spacer"></div>
        <button class="topbar-icon-btn" title="Search">${I.search}</button>
        <button class="topbar-icon-btn" title="Notifications" style="position:relative;">
          ${I.bell}
          <span style="position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber-500);"></span>
        </button>
        <div class="topbar-user">
          <div class="avatar" id="userAvatar">${esc(user.initials)}</div>
          <div class="user-meta">
            <div class="user-name" id="userName">${esc(user.name)}</div>
            <div class="user-role" id="userRole">${esc(user.role)} · ${esc(user.dept)}</div>
          </div>
          <button class="signout" id="signOutBtn">Sign out</button>
        </div>
      </div>

      <div class="workspacebar" id="workspacebar">
        ${WORKSPACES.map(w => `
          <button class="ws-tab" data-nav="${w.id}">${I[w.icon] || ""}<span>${esc(w.label)}</span></button>
        `).join("")}
      </div>

      <div class="shell">
        <nav class="sidebar" id="sidebar" aria-label="Activities"></nav>
        <main class="main" id="moduleHost"></main>
      </div>

      <div class="statusbar">
        <span>Signed in as <b id="sbUser">${esc(user.name)}</b></span>
        <span class="sb-sep"></span>
        <span>${esc(user.role)}</span>
        <span class="sb-sep"></span>
        <span>Session started <b>${new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" })}</b></span>
        <div style="flex:1"></div>
        <span id="sbContext">Ready</span>
      </div>`;
  }

  function routeId() {
    const id = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    return id || "payer";
  }

  function paint(activeId) {
    document.getElementById("sidebar").innerHTML = window.EHR_NAV_RENDER(activeId);
    document.querySelectorAll("#workspacebar .ws-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.nav === activeId);
    });
    document.querySelectorAll("[data-nav]").forEach(btn => {
      if (btn.dataset.wired) return;
      btn.dataset.wired = "1";
      btn.addEventListener("click", () => { location.hash = "#/" + btn.dataset.nav; });
    });
    /* Sidebar is re-rendered each route, so rewire it every time. */
    document.querySelectorAll("#sidebar [data-nav]").forEach(btn => {
      btn.addEventListener("click", () => { location.hash = "#/" + btn.dataset.nav; });
    });
  }

  function setContext(text) {
    const el = document.getElementById("sbContext");
    if (el) el.textContent = text;
  }

  function placeholder(host, id) {
    const label = (window.EHR_NAV.flatMap(g => g.items).find(i => i.id === id) || {}).label || id;
    host.innerHTML = `
      <div class="activity-head">
        ${window.EHR.pageHead({ module: label, title: label, sub: "Reserved in the portal. No backend wired up yet." })}
      </div>
      <div class="module-body">
        <div class="card"><div class="card-body">
          ${window.EHR.emptyState(
            "Activity not connected",
            "The shell, theme and navigation slot are ready. Add the module file under /pages and register it in navigation.js to bring it online."
          )}
        </div></div>
      </div>`;
  }

  function mount(id) {
    const host = document.getElementById("moduleHost");
    if (current && mounted[current] && typeof mounted[current].unmount === "function") {
      mounted[current].unmount();
    }
    host.innerHTML = "";
    window.scrollTo({ top: 0 });

    const mod = window.EHR_MODULES[id];
    if (!mod) { placeholder(host, id); current = id; setContext("Activity not connected"); return; }

    mounted[id] = mod;
    current = id;
    try {
      mod.mount(host);
      setContext("Ready");
    } catch (err) {
      console.error("[EHR] module failed to mount:", id, err);
      host.innerHTML = `<div class="module-body">${window.EHR.emptyState(
        "This activity could not load", "Check the browser console for details."
      )}</div>`;
      setContext("Load error");
    }
  }

  function go() {
    const id = routeId();
    paint(id);
    mount(id);
  }

  window.EHR_SET_CONTEXT = setContext;

  document.addEventListener("DOMContentLoaded", () => {
    window.EHR_SESSION.require((user) => {
      document.getElementById("app").innerHTML = shellHTML(user);
      document.getElementById("signOutBtn").addEventListener("click", () => {
        if (confirm("Sign out of the EHR workspace?")) window.EHR_SESSION.signOut();
      });
      window.addEventListener("hashchange", go);
      if (!location.hash) location.hash = "#/payer";
      go();
      window.EHR.toast("Welcome, " + user.name.replace(/,.*$/, "") + ".", "success");
    });
  });
})();

</script>
</body>
</html>
